<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quencivel Pagente | Login</title>

    <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        display: ['"Outfit"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        obsidian: {
                            900: '#090c10',
                            800: '#0d1117',
                            700: '#161b22',
                            600: '#21262d'
                        },
                        accent: {
                            emerald: '#10b981',
                            teal: '#0d9488',
                            cyan: '#38bdf8',
                            gold: '#fbbf24'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Base Setup & Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            background: url("GOD.jpg") no-repeat center / cover fixed;
            color: #e6edf3;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            position: relative;
        }

        /* Ambient Dynamic Background & Glowing Orbs */
        .ambient-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: 
                radial-gradient(1100px circle at 15% 20%, rgba(16, 185, 129, 0.2), transparent 60%),
                radial-gradient(900px circle at 85% 80%, rgba(251, 191, 36, 0.18), transparent 60%),
                radial-gradient(700px circle at 50% 50%, rgba(13, 148, 136, 0.12), transparent 70%),
                rgba(9, 12, 16, 0.48); 
            pointer-events: none;
        }

        /* Grain Overlay */
        .bg-grain {
            position: fixed;
            inset: 0;
            z-index: 1;
            opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        /* Main Container Layout */
        .page-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 3.5rem;
            align-items: center;
        }

        @media (min-width: 880px) {
            .page-container {
                grid-template-columns: 430px 1fr;
            }
        }

        /* Enhanced Glassmorphism Card */
        .wrapper {
            width: 100%;
            background: rgba(13, 17, 23, 0.42);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow: 
                0 35px 70px -15px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.35),
                inset 0 -1px 0 rgba(0, 0, 0, 0.4);
            color: #e6edf3;
            border-radius: 1.75rem;
            padding: 42px 36px;
            animation: zoomIn 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: all 0.35s ease;
        }

        .wrapper:hover {
            border-color: rgba(255, 255, 255, 0.32);
            box-shadow: 
                0 45px 85px -15px rgba(0, 0, 0, 0.8),
                0 0 35px rgba(16, 185, 129, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.45);
        }

        .wrapper.shake {
            animation: shake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        .wrapper h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.35rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 24px;
            color: #ffffff;
            letter-spacing: -0.03em;
            text-shadow: 0 4px 12px rgba(0,0,0,0.5);
        }

        /* Error Notification Alert */
        .error-message {
            display: none;
            background: rgba(239, 68, 68, 0.22);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #fca5a5;
            padding: 11px 16px;
            border-radius: 12px;
            font-size: 0.875rem;
            text-align: center;
            margin-bottom: 20px;
            backdrop-filter: blur(8px);
            animation: fadeIn 0.3s ease;
        }

        /* Modern Input Styling */
        .wrapper .input-box {
            position: relative;
            width: 100%;
            height: 52px;
            margin: 22px 0;
        }

        .input-box input {
            width: 100%;
            height: 100%;
            background: rgba(22, 27, 34, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.18);
            outline: none;
            border-radius: 40px;
            font-size: 0.95rem;
            color: #ffffff;
            padding: 0 48px 0 22px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(6px);
        }

        .input-box input:focus {
            border-color: #10b981;
            background: rgba(22, 27, 34, 0.75);
            box-shadow: 0 0 22px rgba(16, 185, 129, 0.45);
            transform: translateY(-1px);
        }

        .input-box input::placeholder {
            color: #9ca3af;
        }

        .input-box i {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: #9ca3af;
            transition: color 0.3s ease;
        }

        .input-box input:focus ~ i {
            color: #10b981;
        }

        .input-box .toggle-password {
            cursor: pointer;
        }

        .input-box .toggle-password:hover {
            color: #34d399;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.875rem;
            margin: -4px 0 24px;
            color: #cbd5e1;
        }

        .remember-forgot label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .remember-forgot label input {
            accent-color: #10b981;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .remember-forgot a {
            color: #10b981;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .remember-forgot a:hover,
        .register-link p a:hover {
            text-decoration: underline;
            color: #34d399;
            text-shadow: 0 0 10px rgba(52, 211, 153, 0.4);
        }

        /* Emerald Glow Button */
        .wrapper .btn {
            width: 100%;
            height: 50px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            outline: none;
            border-radius: 40px;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.5);
            cursor: pointer;
            font-size: 1rem;
            color: #042f2e;
            font-weight: 800;
            letter-spacing: 0.02em;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .wrapper .btn:hover {
            background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(16, 185, 129, 0.7);
        }

        .wrapper .btn:active {
            transform: translateY(0);
        }

        .wrapper .register-link {
            font-size: 0.875rem;
            text-align: center;
            margin-top: 24px;
            color: #cbd5e1;
        }

        .register-link p a {
            color: #10b981;
            text-decoration: none;
            font-weight: 600;
        }

        /* RIGHT SIDE: SPACING & TYPOGRAPHY IMPROVEMENTS */
        .right-content {
            padding: 1.5rem;
            text-align: left;
            animation: fadeInRight 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        @media (max-width: 879px) {
            .right-content {
                text-align: center;
                align-items: center;
                order: -1;
                padding: 1rem 0;
            }
        }

        /* Expanded Spacing for "UNA ANG GINOO" */
        .right-content .tagline-title {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(3.2rem, 6.8vw, 5.25rem);
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 40%, #e2e8f0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 14px 28px rgba(0,0,0,0.8));
            margin-bottom: 0.75rem;
        }

        .right-content .tagline-sub {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.5rem, 2.7vw, 2.25rem);
            font-weight: 700;
            color: #34d399;
            text-transform: none;
            letter-spacing: 0.04em;
            display: block;
            margin-bottom: 2rem;
            filter: drop-shadow(0 0 15px rgba(52, 211, 153, 0.45));
        }

        /* "LIGHT OF THE WORLD" Golden Badge with Enhanced Spacing */
        .right-content .sub-tagline {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.3rem, 3vw, 2.1rem);
            font-weight: 900;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 0.85rem;
            padding: 12px 28px;
            border-radius: 50px;
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.3);
            backdrop-filter: blur(12px);
            width: fit-content;
            
            /* Golden Shimmer Gradient */
            background-image: linear-gradient(135deg, #fef08a 0%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            box-shadow: 0 0 35px rgba(245, 158, 11, 0.25);
            margin-bottom: 1.5rem; /* Space below the light of the world badge */
        }

        /* Bible Verse Styling */
        .right-content .bible-verse {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: clamp(0.95rem, 1.4vw, 1.15rem);
            font-weight: 500;
            font-style: italic;
            color: #cbd5e1;
            max-width: 550px;
            line-height: 1.6;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            border-left: 3px solid #fbbf24;
            padding-left: 1rem;
            margin-top: 0.5rem;
        }

        .sun-icon {
            color: #fbbf24;
            filter: drop-shadow(0 0 14px rgba(251, 191, 36, 0.95));
            animation: spinSlow 22s linear infinite;
        }

        /* Animations */
        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.95) translateY(14px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes fadeInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
            40%, 60% { transform: translate3d(5px, 0, 0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Ambient Dynamic Layer -->
    <div class="ambient-bg"></div>
    <div class="bg-grain"></div>

    <!-- Main Container -->
    <div class="page-container">

        <!-- LEFT SIDE: Glassmorphism Login Card -->
        <div class="wrapper" id="loginCard">
            <form id="loginForm" onsubmit="handleLogin(event)">
                <h1>Login</h1>
                
                <!-- Error Banner -->
                <div class="error-message" id="errorMessage">
                    <i class="ri-error-warning-line"></i> Incorrect username or password!
                </div>

                <!-- Username Input -->
                <div class="input-box">
                    <input type="text" id="usernameInput" placeholder="Username" required autocomplete="off">
                    <i class="ri-user-3-line"></i>
                </div>

                <!-- Password Input -->
                <div class="input-box">
                    <input type="password" id="passwordInput" placeholder="Password" required>
                    <i class="ri-eye-off-line toggle-password" id="togglePasswordIcon" onclick="togglePasswordVisibility()"></i>
                </div>

                <!-- Options -->
                <div class="remember-forgot">
                    <label><input type="checkbox" id="rememberMe"> Remember me</label>
                    <a href="#">Forgot password?</a> 
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn" id="loginBtn">
                    <span id="btnText">Login</span>
                    <i class="ri-loader-4-line text-xl animate-spin hidden" id="btnSpinner"></i>
                </button>

                <!-- Registration Link -->
                <div class="register-link">
                    <p>Don't have an account? <a href="#">Register</a></p>
                </div>        
            </form>  
        </div>

        <!-- RIGHT SIDE: TAGLINES & BIBLE VERSE -->
        <div class="right-content">
            <h2 class="tagline-title">UNA ANG GINOO</h2>
            <span class="tagline-sub">(God's First)</span>
            
            <div class="sub-tagline">
                <i class="ri-sun-fill sun-icon"></i>
                <span>LIGHT OF THE WORLD</span>
            </div>

            <p class="bible-verse">
                Jeremiah 29:11 – “For I know the plans I have for you… plans to give you a future and a hope.”
            </p>
        </div>

    </div>

    <!-- Interactivity & Verification Script -->
    <script>
        // Password Visibility Toggle
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('passwordInput');
            const toggleIcon = document.getElementById('togglePasswordIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('ri-eye-off-line');
                toggleIcon.classList.add('ri-eye-line');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('ri-eye-line');
                toggleIcon.classList.add('ri-eye-off-line');
            }
        }

        // Login Handler Function
        function handleLogin(event) {
            event.preventDefault();

            const usernameInput = document.getElementById('usernameInput').value.trim();
            const passwordInput = document.getElementById('passwordInput').value.trim();
            const errorMessage = document.getElementById('errorMessage');
            const loginCard = document.getElementById('loginCard');
            const loginBtn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            // Exact Login Credentials
            const validUsername = "PAGENTEQ13";
            const validPassword = "QUENCY25";

            if (usernameInput === validUsername && passwordInput === validPassword) {
                // Successful Validation
                errorMessage.style.display = 'none';
                btnText.textContent = "Logging in...";
                btnSpinner.classList.remove('hidden');
                loginBtn.disabled = true;

                // Smooth 1.5s loading buffer before page transition
                setTimeout(() => {
                    window.location.href = 'PAGE-1.HTML';
                }, 1500);

            } else {
                // Failed Attempt: Trigger shake animation and error banner
                errorMessage.style.display = 'block';
                loginCard.classList.remove('shake');
                void loginCard.offsetWidth; // Reflow reset
                loginCard.classList.add('shake');
            }
        }
    </script>

</body>
</html>
